name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-apk-release.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Prepare mobile configuration
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=BACKEND_URL=https://legalease-api-mufi.onrender.com

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../LegalEase-Mobile-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegalEase-Mobile-v1.0.0
          path: LegalEase-Mobile-v1.0.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: LegalEase Mobile v1.0.0
          body: Release APK configured to use the deployed LegalEase ASP.NET API.
          files: LegalEase-Mobile-v1.0.0.apk
          fail_on_unmatched_files: true
